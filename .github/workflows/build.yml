name: Build and release

on:
  push:
    branches:
      - master
    # The release job commits the version bump and the catalog metadata back
    # to master. Ignoring those paths keeps that commit from starting a run
    # that would resolve the next patch and release again.
    paths-ignore:
      - "artifacthub/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per ref. Two master runs must not resolve the same
# version: the second would look up what is taken while the first has not
# pushed its tag yet, and both would publish the same version. They queue
# instead, and only the branches that publish nothing supersede themselves.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The one place a version is decided. The release below keys off this
  # output: a non-empty version means "this run publishes", and nothing else
  # looks at the branch. Anything that is not a push to master resolves to an
  # empty string and only builds.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Tags are the record of what is released, so they must all be here
          # before one can be said to be taken.
          fetch-depth: 0

      - id: resolve
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "$GITHUB_REF does not publish a version"
              exit 0
          fi

          year="$(date -u +%Y)"
          # MMDD as a number: semver forbids the leading zero in "0810"
          month_day="$((10#$(date -u +%m%d)))"
          patch=0
          while git rev-parse -q --verify "refs/tags/${year}.${month_day}.${patch}" >/dev/null; do
              patch="$((patch + 1))"
          done

          version="${year}.${month_day}.${patch}"
          echo "publishing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: [version, test]
    if: needs.version.outputs.version != ''
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The packager names the tarball after the manifest version and reports
      # the plugin under it, so the version is set before packaging rather
      # than renaming the result afterwards.
      - name: Set the version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version

      - name: Package
        run: npm run package

      # Artifact Hub reads one metadata file per version, and installers verify
      # the archive against the checksum it carries — so both are derived from
      # the tarball this run produced, never written by hand.
      - name: Write the catalog metadata
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="headlamp-victoria-logs-${VERSION}.tar.gz"
          checksum="$(sha256sum "$archive" | cut -d' ' -f1)"
          dir="artifacthub/${VERSION}"
          mkdir -p "$dir"
          cp README.md "$dir/README.md"
          cat > "$dir/artifacthub-pkg.yml" <<YAML
          version: ${VERSION}
          name: headlamp_victoria_logs
          displayName: VictoriaLogs
          createdAt: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          description: Persistent workload logs in Headlamp, served from VictoriaLogs
          homeURL: https://github.com/${GITHUB_REPOSITORY}
          annotations:
            headlamp/plugin/archive-url: https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${archive}
            headlamp/plugin/archive-checksum: ${checksum}
            headlamp/plugin/version-compat: ">=0.22"
            headlamp/plugin/distro-compat: in-cluster,web,docker-desktop,desktop
          YAML

      - name: Commit the version and metadata
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The lockfile carries the version too, so it moves with the manifest
          # or master is left describing a version it does not pin.
          git add package.json package-lock.json "artifacthub/${VERSION}"
          git commit -m "Release ${VERSION}"
          git push origin HEAD:master

      # Created last, and from the commit above, so the archive URL the
      # metadata already names resolves the moment the catalog reads it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
              "headlamp-victoria-logs-${VERSION}.tar.gz" \
              --title "$VERSION" \
              --notes "Headlamp plugin ${VERSION}."
